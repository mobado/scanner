name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Which version is this?
        id: version
        run: echo "tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Install window libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (window + CLI)
        run: cargo build --locked
      - name: Tests (mocked /proc and systemd files, sandbox self-test)
        run: cargo test --locked
      - name: Build the static CLI-only binary
        run: RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --locked --no-default-features --target x86_64-unknown-linux-gnu
      - name: Self-test
        run: ./target/x86_64-unknown-linux-gnu/release/scanner --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-static-x86_64
          path: target/x86_64-unknown-linux-gnu/release/scanner

  # The .deb is built inside Debian 13 itself, so its dependencies match Debian's libraries.
  # A release is made when a version tag arrives, or when main carries a version (Cargo.toml)
  # that has no release yet, so a plain "git push" of a new version publishes it too.
  deb:
    needs: test
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    # the push of main and of its tag arrive together: one at a time per version
    concurrency:
      group: release-${{ github.event_name == 'pull_request' && github.ref || needs.test.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl dpkg-dev git pkg-config
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the .deb
        run: sh scripts/build-deb.sh
      - name: Check the package
        run: |
          dpkg-deb -I dist/*.deb
          apt-get install -y ./dist/*.deb
          scanner --version
          scanner --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-deb
          path: dist/*.deb
      - name: Is this version on the Releases page already?
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")
          case "$code" in
            200) echo "missing=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "missing=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "GitHub answered $code"; exit 1 ;;
          esac
      - name: Put the .deb on the Releases page
        if: startsWith(github.ref, 'refs/tags/v') || steps.release.outputs.missing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.deb
          generate_release_notes: true
          # an older version published late must not become "Latest"
          make_latest: legacy
