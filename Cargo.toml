[package]
name = "scanner"
version = "0.19.4"
edition = "2021"
description = "Read-only intrusion and backdoor scanner for Debian 13 (Trixie)"
license = "GPL-3.0-only"
default-run = "scanner"

[lib]
name = "scanner"
path = "src/lib.rs"

[[bin]]
name = "scanner"
path = "src/main.rs"

[features]
default = ["gui"]
# The window (egui). Build with --no-default-features for a plain, static CLI binary.
gui = ["dep:eframe", "dep:image", "dep:egui_system_font_provider"]

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
rustix = { version = "1", features = ["fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tempfile = "3"
eframe = { version = "0.37", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# the symbol fonts the window falls back to (the same crate eframe uses), for offscreen pictures
egui_system_font_provider = { version = "0.37", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
