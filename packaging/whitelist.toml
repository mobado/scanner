# Whitelist for scanner (Debian 13 "Trixie").
# New default entries are added automatically when scanner is upgraded; your own changes are
# kept and entries you remove stay removed. Set add_new_defaults = false to stop that.
# '*' in allowed_suid and fs_exclude_paths matches one name (not '/').

